<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8df7"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- bars -->
  <rect x="112" y="300" width="62" height="120" rx="10" fill="url(#bar)"/>
  <rect x="196" y="250" width="62" height="170" rx="10" fill="url(#bar)"/>
  <rect x="280" y="190" width="62" height="230" rx="10" fill="url(#bar)"/>
  <!-- arrow -->
  <path d="M100 290 L190 205 L245 245 L370 130" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M318 120 L392 108 L380 182 Z" fill="#fff" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
  <!-- coins -->
  <g stroke="#a16207" stroke-width="6">
    <ellipse cx="392" cy="402" rx="58" ry="20" fill="url(#coin)"/>
    <rect x="334" y="372" width="116" height="30" fill="url(#coin)" stroke="none"/>
    <path d="M334 372 v30 M450 372 v30" fill="none"/>
    <ellipse cx="392" cy="372" rx="58" ry="20" fill="url(#coin)"/>
    <rect x="334" y="342" width="116" height="30" fill="url(#coin)" stroke="none"/>
    <path d="M334 342 v30 M450 342 v30" fill="none"/>
    <ellipse cx="392" cy="342" rx="58" ry="20" fill="#fde68a"/>
  </g>
  <text x="392" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#a16207">₪</text>
  <!-- sparkle -->
